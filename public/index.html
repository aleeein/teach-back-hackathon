<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>TeachBack</title><link rel="icon" href="data:,"><meta name="description" content="Learn it by teaching Byte, an AI student. Hackathon prototype."></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@400;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* TeachBack · Sticker Notebook, cleaned up.
   Layout: slim header (level, XP, journey) · one bold mission banner per step · calm white cards below.
   Sticker treatment (ink outline + hard shadow) is reserved for Byte, villains, badges and the main action. */
:root{
  --bg:#F6F7FB;--surface:#FFFFFF;--surface-2:#F0F3FF;--ink:#1B1B3A;--ink-2:#44456A;--muted:#666787;--line:#E3E6F2;--outline:#1B1B3A;
  --cobalt:#3358EA;--cobalt-deep:#2240B8;--cobalt-soft:#E6ECFF;--on-cobalt:#FFFFFF;
  --tomato:#FF5A4E;--tomato-deep:#D63C31;--tomato-soft:#FFE4E1;
  --sun:#FFD23F;--sun-deep:#D9A900;--sun-soft:#FFF5C9;
  --mint:#22B28F;--mint-soft:#DBF5ED;--err:#C2362B;--sticker-ink:#1B1B3A;
  --hand:"Gochi Hand","Comic Sans MS",cursive;--body:"Nunito",ui-rounded,system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;
  --r:22px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101126;--surface:#1A1C38;--surface-2:#22254A;--ink:#F2F1F8;--ink-2:#CFCFE3;--muted:#A5A6C5;--line:#2E3160;--outline:#0A0B1C;
  --cobalt:#6C8BFF;--cobalt-deep:#4A66D9;--cobalt-soft:#232A55;--on-cobalt:#0E0F24;
  --tomato:#FF6B5F;--tomato-deep:#D94C42;--tomato-soft:#3D1F24;--sun:#FFD23F;--sun-deep:#C99A00;--sun-soft:#3A3420;
  --mint:#3DCCA8;--mint-soft:#163A33;--err:#FF7A6E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101126;--surface:#1A1C38;--surface-2:#22254A;--ink:#F2F1F8;--ink-2:#CFCFE3;--muted:#A5A6C5;--line:#2E3160;--outline:#0A0B1C;
  --cobalt:#6C8BFF;--cobalt-deep:#4A66D9;--cobalt-soft:#232A55;--on-cobalt:#0E0F24;
  --tomato:#FF6B5F;--tomato-deep:#D94C42;--tomato-soft:#3D1F24;--sun:#FFD23F;--sun-deep:#C99A00;--sun-soft:#3A3420;
  --mint:#3DCCA8;--mint-soft:#163A33;--err:#FF7A6E;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 56px;display:flex;flex-direction:column;gap:20px}
main{display:flex;flex-direction:column;gap:18px;overflow-wrap:anywhere}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h2{font-family:var(--hand);font-weight:400;font-size:clamp(30px,5.5vw,40px)}
h3{font-size:18px;font-weight:800}
p{margin:0}
b,strong{font-weight:800}
.hand{font-family:var(--hand);font-weight:400}
.muted{color:var(--muted)}
.small{font-size:14px}.tiny{font-size:12px}
.mono{font-family:var(--mono);font-size:.92em}
.label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand .name{font-family:var(--hand);font-size:30px;line-height:1}
.stats{display:flex;align-items:center;gap:8px}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap}
.pill.xp{background:var(--sun-soft);border-color:transparent}
.pill .star{color:var(--sun-deep)}

/* journey track */
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.journey::before{content:"";position:absolute;left:10%;right:10%;top:17px;height:4px;border-radius:2px;background:var(--line)}
.journey .fill{position:absolute;left:10%;top:17px;height:4px;border-radius:2px;background:var(--mint);transition:width .5s}
.journey button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;box-shadow:none;padding:0;min-height:0;font-size:13px;font-weight:700;color:var(--muted)}
.journey button:hover:not(:disabled){transform:none}
.journey .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);font-weight:800;color:var(--muted)}
.journey .done .dot{background:var(--mint);border-color:var(--mint);color:#fff}
.journey .cur{color:var(--ink)}
.journey .cur .dot{background:var(--sun);border-color:var(--outline);color:var(--sticker-ink);box-shadow:0 3px 0 var(--outline)}
.journey button:disabled{opacity:1;cursor:default}
@media (max-width:520px){.journey .lab{font-size:11px}.journey .dot{width:32px;height:32px}.journey::before,.journey .fill{top:14px}}

/* ---------- mission banner ---------- */
.hero{display:flex;gap:18px;align-items:center;padding:22px 24px;border-radius:28px;background:var(--cobalt);color:var(--on-cobalt);position:relative;overflow:hidden}
.hero .byte-av{flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.hero h2{color:var(--on-cobalt)}
.hero p{opacity:.92;max-width:58ch}
.hero .step{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .goals{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hero .goal{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;font-weight:700}
.hero .goal.done{background:var(--sun);color:var(--sticker-ink)}
.hero.hot{background:var(--tomato);color:var(--sticker-ink)}
.hero.hot h2,.hero.hot p{color:var(--sticker-ink)}
.hero.hot .goal{background:rgba(27,27,58,.12)}
@media (max-width:560px){.hero{flex-direction:column;align-items:flex-start;padding:18px}.hero .byte-av{width:64px;height:64px}}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.soft{background:var(--surface-2);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

/* ---------- controls ---------- */
button{font:inherit;font-weight:800;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 18px;min-height:46px;cursor:pointer;transition:transform .08s,box-shadow .08s}
button:hover:not(:disabled){border-color:var(--muted)}
button.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt);box-shadow:0 4px 0 var(--cobalt-deep)}
button.hot{background:var(--tomato);border-color:var(--tomato);color:var(--sticker-ink);box-shadow:0 4px 0 var(--tomato-deep)}
button.sun{background:var(--sun);border-color:var(--sun);color:var(--sticker-ink);box-shadow:0 4px 0 var(--sun-deep)}
button.primary:active:not(:disabled),button.hot:active:not(:disabled),button.sun:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--cobalt-deep)}
button.big{font-size:18px;padding:14px 26px;min-height:56px;border-radius:16px}
button.ghost{background:none;border-color:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
button.small{min-height:38px;padding:6px 14px;font-size:14px;border-radius:12px}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
@media (prefers-reduced-motion:reduce){button,.journey .fill{transition:none}}

textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
textarea:focus,input[type=text]:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px var(--cobalt-soft)}
textarea{min-height:88px;resize:vertical}
textarea:disabled{opacity:.6}
label.check{display:inline-flex;gap:8px;align-items:center;font-weight:700;cursor:pointer;font-size:14px}
label.check input{width:20px;height:20px;accent-color:var(--cobalt)}

.chip{display:inline-block;max-width:100%;padding:3px 10px;border-radius:999px;font-weight:800;font-size:12.5px;background:var(--surface-2);color:var(--ink-2)}
.chip.ok{background:var(--mint-soft);color:var(--ink)}
.chip.bad{background:var(--tomato-soft);color:var(--ink)}
.chip.warn{background:var(--sun-soft);color:var(--ink)}
.chip.info{background:var(--cobalt-soft);color:var(--ink)}

.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;min-width:60px;flex:1}
.bar i{display:block;height:100%;border-radius:999px;background:var(--cobalt);transition:width .6s}
.bar.tomato i{background:var(--tomato)}.bar.mint i{background:var(--mint)}.bar.sun i{background:var(--sun)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---------- topic picker & upload ---------- */
.choice{display:flex;flex-direction:column;gap:10px;text-align:left;align-items:flex-start;padding:20px;border-radius:var(--r);min-height:0;font-weight:400;height:100%}
.choice.sel{border:2.5px solid var(--outline);box-shadow:0 5px 0 var(--outline)}
.choice .t{font-size:20px;font-weight:800}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:26px;border:2px dashed var(--line);border-radius:var(--r);background:var(--surface-2);text-align:center;cursor:pointer}
.drop.over{border-color:var(--cobalt);background:var(--cobalt-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}

/* ---------- villains ---------- */
.villains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.villains{grid-template-columns:minmax(0,1fr)}}
.vcard{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-weight:400;width:100%;min-height:0}
.vcard.sel{border:2.5px solid var(--outline);box-shadow:0 4px 0 var(--outline)}
.vcard .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.vcard .vn{font-weight:800;line-height:1.2}
.vcard .bars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.villain,.byte-av{flex:none}

/* ---------- chat ---------- */
.teach{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.teach{grid-template-columns:minmax(0,1fr)}}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:column;align-items:flex-end}
.bubble{border-radius:20px 20px 20px 6px;padding:12px 16px;background:var(--surface-2);min-width:0;display:flex;flex-direction:column;gap:10px}
.msg.me .bubble{border-radius:20px 20px 6px 20px;background:var(--cobalt);color:var(--on-cobalt)}
.bubble .ask{font-family:var(--hand);font-size:25px;line-height:1.15}
.bubble .say{font-family:var(--hand);font-size:21px;line-height:1.2}
.note-card{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.note-card .q{font-family:var(--hand);font-size:20px;line-height:1.2}
.note-card .u{font-size:14px;color:var(--ink-2)}
.composer{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.composer .controls{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mic{width:60px;height:60px;min-height:60px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--tomato);border-color:var(--tomato);color:var(--sticker-ink);box-shadow:0 4px 0 var(--tomato-deep)}
.mic.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px var(--tomato-soft),0 4px 0 var(--tomato-deep)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:4px solid var(--tomato)}}

.notebook{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.notebook .nbhead{display:flex;align-items:center;gap:8px}
.nbitem{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.nbitem .q{font-family:var(--hand);font-size:19px;line-height:1.2}
details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.old{opacity:.65}

/* ---------- learn ---------- */
.lesson{display:flex;flex-direction:column;gap:10px}
.principle{display:flex;flex-direction:column;gap:4px;font-size:15px}
.principle .src{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.pid{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--surface-2);margin-right:6px}
.url{display:flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.url button{border:0;border-right:1.5px solid var(--line);border-radius:0;font-family:var(--mono);font-weight:600;font-size:14px;padding:8px 10px;box-shadow:none;min-height:44px}
.url button:last-child{border-right:0}
.url button.right{background:var(--mint-soft)}
.url button.wrong{background:var(--tomato-soft)}

/* ---------- battle ---------- */
.predict{display:flex;gap:8px;flex-wrap:wrap}
.predict label{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--hand);font-size:26px;cursor:pointer;background:var(--surface);border:1.5px solid var(--line)}
.predict input{position:absolute;opacity:0;pointer-events:none}
.predict label:has(input:checked){background:var(--sun);border:2.5px solid var(--outline);color:var(--sticker-ink);box-shadow:0 4px 0 var(--outline)}
.predict label:has(input:focus-visible){outline:3px solid var(--cobalt);outline-offset:3px}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.score .tile{padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-width:0}
.score .v{font-family:var(--hand);font-size:clamp(30px,6vw,40px);line-height:1.05;font-variant-numeric:tabular-nums}
.fight{display:flex;flex-direction:column;gap:12px}
.fight .head{display:flex;gap:14px;align-items:center}
.attack{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px;background:var(--surface-2)}
.attack.good{background:var(--mint-soft)}
.attack.bad{background:var(--tomato-soft)}
.attack.warn{background:var(--sun-soft)}
.stamp{align-self:flex-start;font-family:var(--hand);font-size:24px;line-height:1;padding:6px 14px;border:2.5px solid var(--outline);border-radius:10px;background:var(--surface);transform:rotate(-3deg);color:var(--ink)}
.attack.good .stamp{background:var(--mint);color:var(--sticker-ink)}
.attack.bad .stamp{background:var(--tomato);color:var(--sticker-ink)}
@media (prefers-reduced-motion:reduce){.stamp{transform:none}}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:600px){.cmp{grid-template-columns:minmax(0,1fr)}}

/* ---------- badges, toast, confetti ---------- */
.badges{display:flex;gap:18px;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;text-align:center;font-size:13px;font-weight:700}
.badge .disc{width:68px;height:68px;border-radius:50%;border:2.5px solid var(--outline);box-shadow:0 4px 0 var(--outline);display:grid;place-items:center;font-family:var(--hand);font-size:21px;color:var(--sticker-ink)}
.badge.locked{color:var(--muted)}
.badge.locked .disc{border:2px dashed var(--line);box-shadow:none;color:var(--muted);background:transparent}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:12px;align-items:center;padding:12px 18px;border-radius:20px;background:var(--surface);border:2.5px solid var(--outline);box-shadow:0 5px 0 var(--outline);max-width:calc(100vw - 32px)}
.xp-pop{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:21;padding:8px 16px;border-radius:999px;background:var(--sun);color:var(--sticker-ink);font-weight:800;border:2.5px solid var(--outline);box-shadow:0 4px 0 var(--outline);animation:xpfloat 1.6s ease-out forwards}
@keyframes xpfloat{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.levelup{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:21;display:flex;gap:14px;align-items:center;padding:14px 20px;border-radius:22px;background:var(--surface);border:2.5px solid var(--outline);box-shadow:0 6px 0 var(--outline);max-width:calc(100vw - 32px);animation:lvpop .35s ease-out}
@keyframes lvpop{from{opacity:0;transform:translate(-50%,0) scale(.8)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@media (prefers-reduced-motion:reduce){.xp-pop,.levelup{animation:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:19;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}

.status{font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.status.busy::before{content:"";width:14px;height:14px;border-radius:50%;border:3px solid var(--cobalt);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.status.busy::before{animation:none}}
.err{color:var(--err);font-weight:700;font-size:14px}
.banner{border-radius:18px;padding:14px 18px;background:var(--sun-soft)}
.foot{font-size:13px;color:var(--muted);max-width:80ch;display:flex;flex-direction:column;gap:8px}
details.tools{border:1px dashed var(--line);border-radius:14px;padding:10px 14px}
.fade{animation:in .3s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

[hidden]{display:none!important}

/* ---------- cleanup pass ---------- */
.teach{grid-template-columns:minmax(0,1fr);max-width:760px;width:100%;margin-inline:auto}
.notebook{position:static}
.notebook summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
.notebook summary::-webkit-details-marker{display:none}
.notebook summary::after{content:"Show";margin-left:auto;font-size:13px;font-weight:800;color:var(--cobalt)}
.notebook[open] summary::after{content:"Hide"}
.note-card .q,.nbitem .q{font-family:var(--body);font-size:15px;font-style:italic;font-weight:700;line-height:1.4}
.hero.compact{padding:16px 20px;gap:14px;border-radius:24px}
.hero.compact h2{font-size:clamp(26px,4.5vw,32px)}
.hero.compact p{font-size:15px}
@media (max-width:560px){.hero.compact{flex-direction:row;align-items:center}.hero.compact .byte-av{width:48px;height:48px}}
.pill.toggle{min-height:36px;cursor:pointer}
.pill.toggle[aria-pressed="true"]{background:var(--mint-soft)}
@media (max-width:560px){.stats .pill:not(.xp):not(.toggle){display:none}}

/* phone: idea tabs become a compact row so the chat stays near the top */
@media (max-width:600px){
  .villains.tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .villains.tabs .vcard{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 6px}
  .villains.tabs .vcard .villain{width:40px;height:40px}
  .villains.tabs .vcard .tiny{display:none}
  .villains.tabs .vcard .vn{font-size:13px}
  .villains.tabs .vcard .chip{font-size:11px;padding:2px 6px}
}

/* ================= app shell (hub layout) ================= */
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;background:var(--bg)}
.appbar .left{display:flex;align-items:center;gap:8px;min-width:0}
.appbar .title{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .back{min-height:40px;padding:6px 10px;border-radius:12px;background:var(--surface);font-size:14px}
.screen{display:flex;flex-direction:column;gap:16px;overflow-wrap:anywhere}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;max-width:560px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;box-shadow:none;min-height:54px;padding:4px;font-size:12px;font-weight:800;color:var(--muted);border-radius:12px}
.tabbar button[aria-current="page"]{color:var(--cobalt);background:var(--cobalt-soft)}
.tabbar svg{width:24px;height:24px}

/* home */
.byte-say{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:24px;background:var(--cobalt);color:var(--on-cobalt)}
.byte-say .line{font-family:var(--hand);font-size:clamp(22px,4.6vw,27px);line-height:1.15}
.continue{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:20px;background:var(--surface);border:2.5px solid var(--outline);box-shadow:0 5px 0 var(--outline);font-weight:400;min-height:0}
.continue .k{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.continue .t{font-size:19px;font-weight:800}
.continue .go{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--sticker-ink);flex:none;font-size:22px;font-weight:800}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sect h3{font-size:16px}
.topic{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-weight:400;min-height:0}
.topic .t{font-size:18px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.add{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;border-radius:20px;border:2px dashed var(--line);background:transparent;color:var(--ink-2);font-weight:800;min-height:0}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}

/* topic & idea rows */
.idea-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:400;min-height:0}
.idea-row .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.idea-row .n{font-weight:800;font-size:17px}
.idea-row .chev{color:var(--muted);font-size:22px}
.final{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--sun-soft);width:100%;text-align:left;border:0;font-weight:400;min-height:0}
.final.locked{background:var(--surface-2);color:var(--muted)}
.final .t{font-weight:800;font-size:17px}

/* segmented control */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--surface-2)}
.seg button{border:0;background:transparent;box-shadow:none;min-height:44px;border-radius:12px;font-size:15px;color:var(--ink-2);position:relative}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.seg .dot{position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--tomato)}
.idea-head{display:flex;align-items:center;gap:14px}
.idea-head h2{font-family:var(--hand);font-weight:400;font-size:clamp(28px,6vw,36px)}

/* me */
.me-top{display:flex;align-items:center;gap:18px}
.ring.big{width:88px;height:88px}
.ring.big span{width:70px;height:70px;font-size:22px}
.row-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row-item:first-child{border-top:0}

.appbar .pill{min-height:0}
@media (max-width:420px){.appbar .title{font-size:15px}}

.appbar .back{white-space:nowrap;flex:none}
.composer .controls{flex-wrap:nowrap}
.composer .controls .row{flex-wrap:nowrap}

.row-item button{white-space:nowrap;flex:none}

/* ================= onboarding, courses, profile, comfort ================= */
.onb-dots{display:flex;gap:6px;justify-content:center}
.onb-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.onb-dots i.on{background:var(--cobalt);width:22px;border-radius:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{padding:12px 14px;border-radius:16px;background:var(--surface-2)}
.fact b{display:block;font-size:17px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border-radius:18px;font-weight:400;min-height:0;background:var(--surface);border:1.5px solid var(--line)}
.opt b{font-size:16px}
.opt[aria-pressed="true"]{border:2.5px solid var(--outline);box-shadow:0 4px 0 var(--outline);background:var(--cobalt-soft)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chiprow button{min-height:40px;padding:6px 14px;border-radius:999px;font-size:14px}
.chiprow button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tog:first-child{border-top:0}
.switch{width:52px;height:30px;min-height:30px;border-radius:999px;padding:0;position:relative;flex:none;background:var(--line);border:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--mint)}
.switch[aria-pressed="true"]::after{transform:translateX(22px)}
.coll{display:flex;flex-direction:column;gap:10px}
.coll-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.module{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:400;min-height:0}
.module .t{font-weight:800}
.module .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--cobalt)}
.analogy{border-left:4px solid var(--sun);background:var(--sun-soft);padding:12px 14px;border-radius:0 14px 14px 0}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.skill .bar{grid-column:1 / -1}
.summary{white-space:pre-wrap;font-size:15px;background:var(--surface-2);border-radius:14px;padding:14px}
.check-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.check-row:first-child{border-top:0}
.disclaim{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}

.row[style*="nowrap"] > button{flex:none;white-space:nowrap}

.cert-list{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:15px}
:root[data-calm] .cert{box-shadow:none;border-width:1.5px}

  async function teach(tp, cid) {

      return render();
    }
    const prev = activeVersion(tp.nb, cid);
    const field = !prev || tp.restart[cid] ? "main" : needsReteach(tp, cid) ? "reteach" : "followup";
    const baseTurns = field === "followup" ? turnsFor(tp.nb, prev.turnIds).slice(-7) : [];
    const pendingTurn = { id: `t${tp.nb.seq + 1}`, text };
    const data = await api("/api/extract", withCourse(tp, { concept: cid, turns: [...baseTurns.map((t) => ({ id: t.id, text: t.text })), pendingTurn] }), key);
    if (!data) return;
    const { nb, turn } = addTurn(tp.nb, { concept: cid, field, text, afterReview: tp.afterReview });
    if (turn.id !== pendingTurn.id) {
      errs[key] = "Your notebook changed during this check. Try again.";

    delete tp.draftVia[`teach:${cid}`];
    tp.drafts[cid] = "";
    delete tp.restart[cid];

    announce(`Byte updated its notes on ${ideaOf(tp, cid).name}.`);
    save();
    render();
  }
  async function runTest(tp, cid) {
    const key = `test-${cid}`;

    const prior = testsFor(tp, cid).length;
    const bank = prior === 0 ? "A" : "B";
    const snap = snapshot(tp.nb);
    const data = await api("/api/exam", withCourse(tp, { bank, questionIds: i.questions, snapshot: snap }), key);
    if (!data) return;
    if (P().delay) {
      busy[key] = true;
      render();
      await wait(2500);
      delete busy[key];
    }
    tp.tests.push({ id: `x${tp.tests.length + 1}`, idea: cid, bank, repeated: prior >= 2, questionIds: i.questions, snapshot: snap, snapshotVersion: snap.concepts[cid]?.versionId ?? null, prediction: tp.predictions[cid] ?? null, results: data.results, score: data.score, at: Date.now() });
    delete tp.predictions[cid];
    markActive();

    render();
  }
  async function retryQuestion(tp, testId, qid) {

    if (!data) return;
    t.results = t.results.map((r) => r.questionId === qid ? data.results[0] : r);
    const ev = t.results.map((r) => r.evaluation);
    const scored = ev.filter((x) => x.point === 0 || x.point === 1);
    t.score = { points: scored.reduce((a, x) => a + x.point, 0), outOf: t.results.length, complete: scored.length === t.results.length, unknown: ev.filter((x) => ["missing_explanation", "meaning_unclear", "conflicting_teaching"].includes(x.verdict)).length };
    save();
    render();
  }

    const data = await api("/api/learner", withCourse(tp, { form, answers: st.answers }), form);

      save();
      render();
